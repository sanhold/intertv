name: Mise à jour des vidéos YouTube

on:
  schedule:
    - cron: '17 * * * *'   # toutes les heures
  workflow_dispatch:        # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: write
  pages: write

concurrency:
  group: update-youtube
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchroniser avec la chaîne YouTube
        run: python scripts/update_youtube.py

      - name: Enregistrer les changements
        id: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Mise à jour automatique des vidéos YouTube"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Republier le site
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
